##########################################################################
#
# WARNING: This file was generated by update.php.
#
# You can find the relevant template in the `/templates` folder.
#
# Builds an image (PHP or CLI) for one version of PHP on each of the given platforms, and pushes each
# one to the registry by digest.
#
# The digests are uploaded as artifacts so that the calling workflow can combine them into a single
# multi-platform manifest list.
name: Build an image

on:
  workflow_call:
    inputs:
      php-version:
        description: 'The version of PHP to build the image for.'
        required: true
        type: string
      image-type:
        description: 'The type of image to build. Accepts "php" or "cli".'
        required: true
        type: string
      platforms:
        description: 'A JSON array of the platforms to build, each with a "type" (such as "linux/amd64") and the "runner" to build it on.'
        required: true
        type: string

env:
  PR_TAG: -${{ github.event.number }}
  IMAGE: ${{ inputs.image-type == 'cli' && vars.GHCR_CLI_IMAGE || vars.GHCR_PHP_IMAGE }}
  PHP_BASE_IMAGE: ${{ vars.GHCR_PHP_IMAGE }}
  PHP_VERSION: ${{ inputs.php-version }}
  IMAGE_TYPE: ${{ inputs.image-type }}

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.platform.type }} Image
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON( inputs.platforms ) }}
    env:
      ARCH_TYPE: ${{ matrix.platform.type }}
      # A single summary of every published image is added by the calling workflow instead.
      DOCKER_BUILD_SUMMARY: false

    steps:
      - name: Prepare
        run: |
          platform="${IMAGE_TYPE}-${PHP_VERSION}-${ARCH_TYPE}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Login to Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ env.ARCH_TYPE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: "{{defaultContext}}:images/${{ env.PHP_VERSION }}/${{ env.IMAGE_TYPE }}"
          build-args: |
            PHP_BASE_IMAGE=${{ env.PHP_BASE_IMAGE }}
            PR_TAG=${{ env.PR_TAG }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
