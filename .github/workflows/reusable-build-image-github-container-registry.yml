##########################################################################
#
# WARNING: This file was generated by update.php.
#
# You can find the relevant template in the `/templates` folder.
#
# Builds a single multi-platform image (PHP or CLI) for one version of PHP, then publishes it
# to the registry.
#
# Each platform is built in its own job and pushed by digest, then the digests are combined into
# a single multi-platform manifest list.
name: Build and publish an image

on:
  workflow_call:
    inputs:
      php-version:
        description: 'The version of PHP to build the image for.'
        required: true
        type: string
      image-type:
        description: 'The type of image to build. Accepts "php" or "cli".'
        required: true
        type: string

env:
  PR_TAG: -${{ github.event.number }}
  IMAGE: ${{ inputs.image-type == 'cli' && vars.GHCR_CLI_IMAGE || vars.GHCR_PHP_IMAGE }}
  PHP_BASE_IMAGE: ${{ vars.GHCR_PHP_IMAGE }}
  PHP_VERSION: ${{ inputs.php-version }}
  IMAGE_TYPE: ${{ inputs.image-type }}

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  build-arm64:
    name: Build linux/arm64 Image
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
    env:
      ARCH_TYPE: linux/arm64

    steps:
      - name: Prepare
        run: |
          platform="${IMAGE_TYPE}-${PHP_VERSION}-${ARCH_TYPE}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Login to Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ env.ARCH_TYPE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: "{{defaultContext}}:images/${{ env.PHP_VERSION }}/${{ env.IMAGE_TYPE }}"
          build-args: |
            PHP_BASE_IMAGE=${{ env.PHP_BASE_IMAGE }}
            PR_TAG=${{ env.PR_TAG }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-amd64:
    name: Build linux/amd64 Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      ARCH_TYPE: linux/amd64

    steps:
      - name: Prepare
        run: |
          platform="${IMAGE_TYPE}-${PHP_VERSION}-${ARCH_TYPE}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - name: Login to Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ env.ARCH_TYPE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: "{{defaultContext}}:images/${{ env.PHP_VERSION }}/${{ env.IMAGE_TYPE }}"
          build-args: |
            PHP_BASE_IMAGE=${{ env.PHP_BASE_IMAGE }}
            PR_TAG=${{ env.PR_TAG }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package & Publish
    runs-on: ubuntu-26.04
    needs: [ build-arm64, build-amd64 ]
    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ env.IMAGE_TYPE }}-${{ env.PHP_VERSION }}-*
          merge-multiple: true

      - name: Login to Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}-fpm${{ env.PR_TAG }}
            type=raw,value=latest${{ env.PR_TAG }},enable=${{ '8.3' == env.PHP_VERSION }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
