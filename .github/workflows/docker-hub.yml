name: Build and publish images to Docker Hub

on:
  push:
    branches:
      - trunk
    paths:
      - 'config/**'
      - 'entrypoint/**'
      - 'images/**'
      - '.github/workflows/docker-hub.yml'
  workflow_dispatch:
  # Once weekly On Sundays at 00:00 UTC.
  schedule:
    - cron: '0 0 * * 0'

env:
  PR_TAG:


# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:

  build-php-images:
    name: PHP ${{ matrix.php }} (${{ matrix.arch.type }}) Image
    runs-on: ${{ matrix.arch.runner }}
    
    permissions:
        contents: read
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        arch:
          - type: linux/amd64
            runner: ubuntu-24.04
          - type: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PHP_VERSION: ${{ matrix.php }}
      ARCH_TYPE: ${{ matrix.arch.type }}

    steps:
      - name: Prepare
        run: |
          platform="php-${PHP_VERSION}-${ARCH_TYPE}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # 5.7.0
        with:
          images: ${{ vars.DOCKERHUB_PHP_IMAGE }}
      - name: Login to Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # 3.4.0
        with:


          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # 3.10.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # 6.17.0
        with:
          platforms: ${{ env.ARCH_TYPE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.DOCKERHUB_PHP_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: "{{defaultContext}}:images/${{ env.PHP_VERSION }}/php"
          build-args: |
            PR_TAG=${{ env.PR_TAG }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  complete-php-images-platform:
    name: Package multi-arch container image for PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
    needs:
      - build-php-images
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php-${{ env.PHP_VERSION }}-*
          merge-multiple: true

      - name: Login to Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # 3.4.0
        with:


          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # 3.10.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # 5.7.0
        with:
          images: ${{ vars.DOCKERHUB_PHP_IMAGE }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}-fpm${{ env.PR_TAG }}
            type=raw,value=latest${{ env.PR_TAG }},enable=${{ '8.3' == env.PHP_VERSION }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ vars.DOCKERHUB_PHP_IMAGE }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          IMAGE: ${{ vars.DOCKERHUB_PHP_IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  build-cli-images:
    name: Build CLI on PHP ${{ matrix.php }} (${{ matrix.arch.type }})
    runs-on: ${{ matrix.arch.runner }}
    needs: complete-php-images-platform
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
        arch:
          - type: linux/amd64
            runner: ubuntu-24.04
          - type: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      PHP_VERSION: ${{ matrix.php }}
      ARCH_TYPE: ${{ matrix.arch.type }}

    steps:
      - name: Prepare
        run: |
          platform="cli-${PHP_VERSION}-${ARCH_TYPE}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # 5.7.0
        with:
          images: ${{ vars.DOCKERHUB_CLI_IMAGE }}
      - name: Login to Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # 3.4.0
        with:


          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # 3.10.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # 6.17.0
        with:
          platforms: ${{ env.ARCH_TYPE }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.DOCKERHUB_CLI_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: "{{defaultContext}}:images/${{ env.PHP_VERSION }}/cli"
          build-args: |
            PHP_BASE_IMAGE=${{ vars.DOCKERHUB_PHP_IMAGE }}
            PR_TAG=${{ env.PR_TAG }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # 4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1


  complete-cli-images-platform:
    name: Package multi-arch container image for CLI ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
    needs:
      - build-cli-images
    env:
      PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # 4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-cli-${{ env.PHP_VERSION }}-*
          merge-multiple: true

      - name: Login to Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # 3.4.0
        with:


          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # 3.10.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # 5.7.0
        with:
          images: ${{ vars.DOCKERHUB_CLI_IMAGE }}
          tags: |
            type=raw,value=${{ env.PHP_VERSION }}-fpm${{ env.PR_TAG }}
            type=raw,value=latest${{ env.PR_TAG }},enable=${{ '8.3' == env.PHP_VERSION }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ vars.DOCKERHUB_CLI_IMAGE }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect image
        env:
          IMAGE: ${{ vars.DOCKERHUB_CLI_IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
