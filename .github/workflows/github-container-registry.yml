##########################################################################
#
# WARNING: This file was generated by update.php.
#
# You can find the relevant template in the `/templates` folder.
#
name: Build test images

on:
  pull_request:
  workflow_dispatch:

env:
  PR_TAG: -${{ github.event.number }}
# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  check-for-changes:
    name: Check for uncommitted changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 'latest'

      - name: Build images
        run: php update.php

      - name: Ensure version-controlled files are not modified or deleted
        run: git diff --exit-code
  build-php-images:
    name: PHP ${{ matrix.php }}
    needs: [ check-for-changes ]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
    uses: ./.github/workflows/reusable-build-image-github-container-registry.yml
    with:
      php-version: ${{ matrix.php }}
      image-type: php
      platforms: >-
        [
          { "type": "linux/amd64", "runner": "ubuntu-26.04" },
          { "type": "linux/arm64", "runner": "ubuntu-26.04-arm" }
        ]

  package-php-images:
    name: Package & Publish PHP Images
    needs: [ build-php-images ]
    permissions:
      packages: write
    uses: ./.github/workflows/reusable-package-images-github-container-registry.yml
    with:
      image-type: php
      php-versions: >-
        [ "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6" ]

  build-cli-images:
    name: CLI on PHP ${{ matrix.php }}
    needs: [ package-php-images ]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]
    uses: ./.github/workflows/reusable-build-image-github-container-registry.yml
    with:
      php-version: ${{ matrix.php }}
      image-type: cli
      platforms: >-
        [
          { "type": "linux/amd64", "runner": "ubuntu-26.04" },
          { "type": "linux/arm64", "runner": "ubuntu-26.04-arm" }
        ]

  package-cli-images:
    name: Package & Publish CLI Images
    needs: [ build-cli-images ]
    permissions:
      packages: write
    uses: ./.github/workflows/reusable-package-images-github-container-registry.yml
    with:
      image-type: cli
      php-versions: >-
        [ "7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6" ]

  summary:
    name: Summary
    runs-on: ubuntu-26.04
    needs: [ package-php-images, package-cli-images ]
    # Summarize the images that were published, even when some failed.
    if: ${{ !cancelled() }}
    permissions: {}

    steps:
      - name: Download image details
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/image-details
          pattern: image-details-*
          merge-multiple: true

      - name: Write the summary
        run: |
          shopt -s nullglob
          files=( "$RUNNER_TEMP"/image-details/*.json )

          {
            echo '## Published images'
            echo

            if (( ${#files[@]} == 0 )); then
              echo 'No images were published.'
            else
              echo '| Image | Platforms | Digest |'
              echo '| --- | --- | --- |'
              jq -rs '
                sort_by( ( .type != "php" ), ( .php | split( "." ) | map( tonumber ) ) )
                | .[]
                | "| \( .url as $url | .tags | map( "[`\( . )`](\( $url ))" ) | join( "<br>" ) ) | \( .platforms | join( ", " ) ) | `\( .digest[0:19] )` |"
              ' "${files[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
